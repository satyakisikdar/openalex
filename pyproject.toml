[project]
name = "openalex"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "brotli>=1.1.0",
    "ipykernel>=6.29.5",
    "jupyterlab>=4.4.4",
    "orjson>=3.11.5",
    "pandas-stubs>=2.3.3.251219",
    "pandas[all]>=2.3.3",
    "pyarrow>=22.0.0",
    "python-box>=7.3.2",
    "requests>=2.32.4",
    "ruff>=0.14.10",
    "seaborn>=0.13.2",
    "tqdm>=4.67.1",
    "ujson>=5.11.0",
    "unidecode>=1.4.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "ty>=0.0.94"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
extend-exclude = ["_old", "notebooks"]

[tool.ruff.format]
quote-style = "single"
# Legacy files are not yet formatted; drop each from this list when it gets cleaned up.
exclude = ["src/*.py", "preprocessing/*.py", "refactor_SciSciNetv2.py", "main.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "PTH", "UP"]

[tool.ruff.lint.per-file-ignores]
# Legacy debt baseline (see .claude/docs/notes.md). New code must not add to it.
"src/*.py" = ["E", "F", "W", "I", "PTH", "UP"]
"preprocessing/*.py" = ["E", "F", "W", "I", "PTH", "UP"]
"refactor_SciSciNetv2.py" = ["E", "F", "W", "I", "PTH", "UP"]

[tool.ty.src]
include = ["src", "tests"]

[[tool.ty.overrides]]
# Legacy debt baseline (46 diagnostics); remove a file from here once it type-checks.
include = ["src/utils.py", "src/entities.py", "src/objects.py"]
rules = { all = "ignore" }
